name: Cek HUMBA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cek-sintaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Periksa sintaks JavaScript di app.js
        run: |
          node --check app.js
          echo "Sintaks JavaScript OK"