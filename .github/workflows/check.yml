name: Cek HUMBA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cek-sintaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Periksa sintaks JavaScript di index.html
        run: |
          python3 -c "import re, pathlib; t = pathlib.Path('index.html').read_text(); s = re.findall(r'<script>(.*?)</script>', t, re.S); open('/tmp/app.js','w').write(s[-1])"
          node --check /tmp/app.js
          echo "Sintaks JavaScript OK"
